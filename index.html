<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
    <body>
        <main>
           <h1>Weather Dashboard</h1>
            <div class="weather-card">
                <div class="search-box"> 
                    <label for="city-input">Enter a city:</label>
                    <input type="text" id="city-input" placeholder="Enter a city">
                    <button id="search-button">Search</button>
                </div>
                <div class="weather_img">
                    <img src="https://img.magnific.com/premium-vector/weather-icon-represents-various-atmospheric-conditions-such-as-sun-rain-clouds-snow_142112-6357.jpg?semt=ais_hybrid&w=740&q=80" alt="img_didn't_loading">
                </div>
            </div>
        </main>
    </body>
    <script src="script.js"></script>
</html>
